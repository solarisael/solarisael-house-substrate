[package]
name = "solarisael-house-substrate"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
house-core = { path = "../solarisael-house-rust/crates/house-core" }
house-protocol = { path = "../solarisael-house-rust/crates/house-protocol" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[lib]
name = "solarisael_house_substrate"
path = "src/lib.rs"

[[bin]]
name = "solarisael-house-substrate"
path = "src/main.rs"

